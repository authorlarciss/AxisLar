name: CI

on:
  push:
    branches:
      - nu
      - omega
      - "omicron/**"
      - "iota/**"
      - "alpha/**"
      - "beta/**"
      - "gamma/**"
      - "delta/**"
      - "epsilon/**"
      - "lambda/**"
      - "tau/**"
      - "sigma/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - nu
      - omega

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check
        run: make check

  dist:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build distribution (nu -> axislar_core)
        run: make dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      # gh CLI вместо softprops/action-gh-release: экшен ретраил 500 от API
      # и падал без внятной причины. Здесь шаг идемпотентен и логирует ответ.
      # GitHub API на создании релиза периодически отвечает HTTP 500, хотя
      # релиз создаётся (ответ рвётся). Поэтому create не считается
      # обязательным: если релиз появился — грузим ассеты в него.
      - name: Attach artifacts to release (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          tag="${GITHUB_REF_NAME}"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            notes="$(awk '/^## \[/{flag=1} flag' CHANGELOG.md | head -40)"
            gh release create "$tag" --title "$tag" --notes "${notes:-Release $tag}" || true
          fi

          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag is not visible yet; skipped asset upload" >&2
            exit 0
          fi

          for attempt in 1 2 3; do
            if gh release upload "$tag" dist/* --clobber; then
              break
            fi
            sleep 5
          done
          gh release view "$tag" --json assets -q '.assets[].name' || true

  # Публикация ядра в PyPI по тегу через OIDC Trusted Publishing.
  #
  # По умолчанию job выключен: PyPI выдаёт токен только проектам, у которых
  # настроен publisher. Включение — переменная репозитория PYPI_OIDC=true
  # после того, как на PyPI в настройках axislar-core добавлен publisher
  # (владелец: authorlarciss, репозиторий AxisLar, workflow ci.yml,
  # environment release). До этого ядро публикуется вручную токеном.
  publish:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_OIDC == 'true'
    needs: dist
    permissions:
      id-token: write
      contents: read
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*
