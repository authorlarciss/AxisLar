name: CI

on:
  push:
    branches:
      - nu
      - omega
      - "omicron/**"
      - "iota/**"
      - "alpha/**"
      - "beta/**"
      - "gamma/**"
      - "delta/**"
      - "epsilon/**"
      - "lambda/**"
      - "tau/**"
      - "sigma/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - nu
      - omega

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check
        run: make check

  dist:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build distribution (nu -> axislar_core)
        run: make dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      # gh CLI вместо softprops/action-gh-release: экшен ретраил 500 от API
      # и падал без внятной причины. Здесь шаг идемпотентен и логирует ответ.
      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            # --generate-notes отключён: GitHub API отдаёт 500 на автогенерации
            # release notes для этого репозитория. Заметки берём из CHANGELOG.
            notes="$(awk '/^## \[/{flag=1} flag' CHANGELOG.md | head -40)"
            gh release create "$tag" --title "$tag" --notes "${notes:-Release $tag}"
          fi
          gh release upload "$tag" dist/* --clobber
          gh release view "$tag" --json assets -q '.assets[].name'
