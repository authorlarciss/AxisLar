[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axislar-core"
dynamic = ["version"]
description = "AxisLar core — многомерное ядро: оси, фасеты, объекты (без продукта и плагинов)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.15"
authors = [
    { name = "authorlarciss", email = "author.larciss@gmail.com" }
]
dependencies = [
    "pydantic>=2.14.4",
    "axislar-contract>=6,<7",
]

[project.urls]
Homepage = "https://github.com/authorlarciss/AxisLar"
Source = "https://github.com/authorlarciss/AxisLar"
Changelog = "https://github.com/authorlarciss/AxisLar/blob/HEAD/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pre-commit>=3.6",
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "import-linter>=2.0",
]

[tool.setuptools.dynamic]
version = { attr = "nu.mu.public.__version__" }

[tool.setuptools.package-data]
nu = ["py.typed"]

# Разработка: контракт берётся из соседнего каталога, чтобы правки контракта
# проверялись без публикации. В метаданные колеса попадает обычный диапазон.
[tool.uv.sources]
axislar-contract = { path = "contract", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["nu*"]

# ---------- Mypy ----------
[tool.mypy]
python_version = "3.13"
# Контракт в разработке — соседний проект (`contract/`); mypy не видит его
# через editable-установку, поэтому путь указывается явно.
mypy_path = "contract"
strict = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
show_error_context = true
pretty = true
exclude = ["^\\.venv/", "^build/", "^dist/"]

# Нетипизированные библиотеки — точечно, не глобально.
# Глобальный ignore_missing_imports скрыл бы реальные ошибки
# в типизированных пакетах.
[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "torch.*",
    "datasets.*",
    "huggingface_hub.*",
    "safetensors.*",
]
ignore_missing_imports = true
follow_imports = "skip"

# ---------- Ruff ----------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["nu", "tau", "eta"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["nu", "tau", "eta"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------- Pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --cov=nu --cov=eta --cov-branch --cov-report=term-missing"
testpaths = ["tau"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "unit: быстрый тест одного модуля, без внешних границ",
    "integration: несколько модулей через psi.bootstrap",
    "contract: контрактный набор, параметризуется по реализации (бэкенду)",
    "e2e: полный конвейер от входа до выхода",
]

[tool.importlinter]
root_package = "nu"
include_external_packages = false

# Ядро — пять модулей: alpha (DTO), beta (проверки), delta (хранилище),
# sigma (логи), mu (версии). Продукт и плагины живут в отдельных проектах,
# поэтому правила про них здесь отсутствуют.

# ============================================================
# Правило 1. Только psi собирает ядро.
# ============================================================
[[tool.importlinter.contracts]]
name = "Only psi may import psi.bootstrap and psi.core"
type = "forbidden"
source_modules = ["nu.alpha", "nu.beta", "nu.delta", "nu.sigma", "nu.mu"]
forbidden_modules = ["nu.psi.bootstrap", "nu.psi.core"]

# ============================================================
# Правило 2. Модули независимы друг от друга; связи — через psi.contracts.
# Белый список генерируется: `make contracts` (eta/sync_contracts.py).
# ============================================================
[[tool.importlinter.contracts]]
name = "Modules are independent"
type = "independence"
modules = ["nu.alpha", "nu.beta", "nu.delta", "nu.sigma", "nu.mu"]
ignore_imports = [
    # >>> contracts:generated rule2
    "nu.psi.contracts.** -> nu.alpha.**",
    "nu.psi.contracts.** -> nu.beta.**",
    "nu.psi.contracts.** -> nu.delta.**",
    "nu.psi.contracts.** -> nu.iota.**",
    "nu.psi.contracts.** -> nu.sigma.**",
    "nu.psi.contracts.** -> nu.mu.**",
    # <<< contracts:generated rule2
]
unmatched_ignore_imports_alerting = "error"

# ============================================================
# Правило 3. Psi и main не трогают _internal напрямую.
# Только прямой импорт: цепочка через public/resolver.py легальна
# (allow_indirect_imports), поэтому белый список не нужен (ADR-0007).
# ============================================================
[[tool.importlinter.contracts]]
name = "Psi and main do not import _internal except via resolver"
type = "forbidden"
source_modules = ["nu.psi", "nu.main"]
forbidden_modules = [
    "nu.alpha._internal",
    "nu.beta._internal",
    "nu.delta._internal",
    "nu.iota._internal",
    "nu.sigma._internal",
    "nu.mu._internal",
]
allow_indirect_imports = true

# ============================================================
# Правило 4. Public не импортирует _internal (кроме resolver).
# ============================================================
[[tool.importlinter.contracts]]
name = "Public does not import _internal except via resolver"
type = "forbidden"
source_modules = [
    "nu.alpha.public",
    "nu.beta.public",
    "nu.delta.public",
    "nu.iota.public",
    "nu.sigma.public",
    "nu.mu.public",
]
forbidden_modules = [
    "nu.alpha._internal",
    "nu.beta._internal",
    "nu.delta._internal",
    "nu.iota._internal",
    "nu.sigma._internal",
    "nu.mu._internal",
]
ignore_imports = [
    # >>> contracts:generated rule5
    "nu.delta.public.resolver -> nu.delta._internal.memory",
    "nu.sigma.public.resolver -> nu.sigma._internal.setup",
    # <<< contracts:generated rule5
]
unmatched_ignore_imports_alerting = "error"

# ============================================================
# Правило 5. Точки входа (main, contracts) импортируют только из nu.psi.
# ============================================================
[[tool.importlinter.contracts]]
name = "entry modules import only from nu.psi"
type = "forbidden"
source_modules = ["nu.main", "nu.contracts"]
forbidden_modules = [
    "nu.alpha",
    "nu.beta",
    "nu.delta",
    "nu.iota",
    "nu.sigma",
    "nu.mu",
]
allow_indirect_imports = true
